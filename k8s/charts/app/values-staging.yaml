# Staging overrides.
#
#   helm upgrade --install app-staging k8s/charts/app \
#     --namespace staging --create-namespace \
#     --values k8s/charts/app/values-staging.yaml \
#     --set image.tag="$GIT_SHA"
#
# Only the keys that differ from `values.yaml` belong here. Helm merges maps
# deeply, so this file does not repeat the defaults — and a key set to `null`
# here *deletes* the chart default rather than overriding it, which
# `npm run audit:helm` fails on when the deleted key is a required one.

environment: staging

# Two replicas is the floor at which a rolling update, a node drain, or a single
# crash is not an outage. Staging carries no traffic worth scaling for.
replicaCount: 2

# The HPA is on in staging for one reason: an autoscaler that is only ever
# exercised in production is one whose thresholds nobody has watched behave.
# The ceiling is deliberately low — 4 pods at 50m is a fifth of one t3.large,
# so a runaway scale-up in staging cannot consume the node group.
autoscaling:
  minReplicas: 2
  maxReplicas: 4
  # Same target as production, so a load test here measures the same control
  # loop. What differs is what sits behind it: 50m of CPU request per pod
  # rather than 500m, so 60% of the request is a tenth of the traffic.
  targetCPUUtilizationPercentage: 60

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/staging-app
  # Overwritten per deploy with the commit SHA. The literal here is what a
  # `helm template` in CI renders, and what someone gets if they install this
  # file by hand — a real tag rather than a moving one, so the failure is a
  # missing image and not the wrong image.
  tag: "0.1.0"

serviceAccount:
  annotations:
    # Created by `EksStack.addIrsaRole` — see docs/eks.md §2. The trust policy
    # names `staging/app-staging`, so this annotation and that role have to
    # agree on both the namespace and the service account name.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/staging-app-irsa

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 128Mi

config:
  LOG_LEVEL: debug
  LOG_FORMAT: json

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# The public entry point. `example.com` is reserved for documentation (RFC 2606)
# and resolves nowhere, so a copy of this file that nobody edited fails at
# external-dns — which cannot find a hosted zone for it — rather than publishing
# a record into somebody else's domain.
ingress:
  enabled: true
  hosts:
    - app.staging.example.com
  tls:
    # Let's Encrypt's *staging* ACME endpoint, and the reason is a rate limit
    # rather than a preference. The production endpoint allows 50 certificates
    # per week counted on the *registered* domain — `example.com`, not
    # `app.staging.example.com` — so a staging cluster that redeploys on every
    # merge does not merely exhaust its own quota, it blocks issuance in
    # production. The cost is a certificate browsers do not trust, which is the
    # correct cost for a hostname no browser should be visiting.
    clusterIssuer: letsencrypt-staging

# `networkPolicy` is otherwise inherited whole from the chart defaults: the same
# default-deny, the same DNS rule, the same HTTPS-to-AWS egress entry. Staging
# runs the identical policy on purpose — a boundary only production has is one
# whose first real exercise is in production. Narrowing egress per environment
# (VPC endpoint ranges instead of 0.0.0.0/0) is the change that would go here;
# see docs/network-policies.md §4.
#
# The ingress allowlist is the one part that cannot be inherited. Helm replaces
# lists wholesale rather than merging them, so this entry is restated in
# `values-production.yaml` too; leaving it out of either file is an Ingress that
# terminates TLS and then returns 503 from a controller that cannot open a
# connection to pods the Service reports as ready.
networkPolicy:
  ingress:
    - name: ingress-controller
      # Two selectors in one entry, so they are ANDed: the ingress-nginx
      # controller pods in the ingress-nginx namespace. Not every pod in that
      # namespace, and not every pod anywhere carrying that label.
      namespaceLabels:
        kubernetes.io/metadata.name: ingress-nginx
      podLabels:
        app.kubernetes.io/name: ingress-nginx
      ports:
        # The container port by name, never `service.port`. kube-proxy rewrites
        # the destination to the container port before policy is evaluated, so
        # a rule naming 80 here matches nothing and the connection is dropped —
        # as a timeout, which reads as a slow application.
        - port: http
          protocol: TCP
