# Chart defaults.
#
# These are the values every environment starts from; `values-staging.yaml` and
# `values-production.yaml` override the ones that differ. Helm merges maps
# deeply and replaces scalars and arrays wholesale, so an environment file lists
# only what it changes.
#
# Every key here is constrained by `values.schema.json`, which Helm enforces on
# `lint`, `template`, `install` and `upgrade`. A key that is not in the schema is
# rejected rather than ignored: `replicas: 3` is a typo for `replicaCount`, and a
# chart that silently accepts it deploys one replica and reports success.

# Which environment this release is. Carried into the `app.kubernetes.io/…`
# labels and into `APP_ENVIRONMENT` in the container, so a pod can be traced
# back to the values file that produced it. There is no safe default — every
# environment file sets it, and `npm run audit:helm` fails if one disagrees with
# its own filename.
environment: staging

# Release-level naming. `nameOverride` changes the chart-name half of the
# generated resource names; `fullnameOverride` replaces the generated name
# entirely. Both empty means names are derived from the release, which is what
# lets two releases of this chart coexist in one namespace.
nameOverride: ""
fullnameOverride: ""

# Desired pods when `autoscaling.enabled` is false.
#
# When the HPA is enabled the Deployment is rendered *without* a `replicas`
# field, so this value stops reaching the cluster — see the comment on
# `autoscaling` below. It is still required, and `npm run audit:helm` requires it
# to sit inside the HPA's range, so that turning autoscaling off is a change of
# mechanism and not a silent change of capacity.
replicaCount: 2

# Horizontal Pod Autoscaler.
#
# The HPA scales pods; the Cluster Autoscaler scales the nodes underneath them
# (`EksStack`, docs/eks.md §7). They are two loops with different periods —
# roughly 90 seconds to a serving pod versus two to four minutes to a serving
# node — and docs/autoscaling.md derives every number below, states the four
# inputs each one falls out of, and says plainly which of those have been
# measured and which have not.
#
# Two things about enabling this are not obvious and both bite in production:
#
#   • The Deployment stops declaring `replicas`. If it kept declaring one, every
#     `helm upgrade` would reset the replica count to `replicaCount` and the HPA
#     would scale back up afterwards — a capacity dip on every deploy, worst at
#     exactly the busy moments when the fleet is far above its floor.
#   • Because the field is absent, the *first* install creates the Deployment
#     with the Kubernetes default of one replica, and the HPA raises it to
#     `minReplicas` within a sync period (15s). Upgrades are unaffected: the
#     field is absent, so the running count is left alone.
autoscaling:
  enabled: true
  # The floor. This is what the PodDisruptionBudget is checked against when
  # autoscaling is on, not `replicaCount` — a drain that arrives while the HPA
  # sits at its floor is the drain that has the least room to succeed.
  minReplicas: 2
  # The ceiling, and the number that has to fit the node group. `maxReplicas ×
  # resources.requests.cpu` above what the Cluster Autoscaler's maximum node
  # count can supply does not fail — it leaves Pending pods that never schedule
  # and an HPA that reports success. See docs/autoscaling.md §3.
  maxReplicas: 6
  # A percentage of the CPU *request*, not of the limit and not of the node.
  # Above the reference profile's knee (~85% of request) latency degrades
  # sharply, and the gap between the target and the knee is the headroom that
  # covers the ~90s it takes a scale-up to start serving.
  targetCPUUtilizationPercentage: 60
  # Memory scaling is off by default and is usually wrong for this shape of
  # service: `requests.memory` equals `limits.memory` here, so a runtime that
  # holds freed pages (a JVM heap, a Go heap between releases) sits near its
  # target permanently — the HPA then scales up and never scales back down.
  # Set it only for a service whose memory tracks concurrency.
  # targetMemoryUtilizationPercentage: 75
  behavior:
    # Up fast: no stabilization window, and whichever of the two policies moves
    # more. Doubling every 30 seconds takes the fleet from its floor to its
    # ceiling in about a minute and a half, which is the same order as the
    # HPA's own reaction time — making it slower would not help, and making it
    # faster only queues pods the nodes cannot yet hold.
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      percent:
        value: 100
        periodSeconds: 30
      pods:
        value: 4
        periodSeconds: 30
    # Down slowly. `stabilizationWindowSeconds` is the window the HPA takes the
    # *highest* recommendation from, so five minutes means a trough has to last
    # five minutes before it removes anything — and removing at most a quarter
    # of the fleet per minute means a scale-down that turns out to be wrong is
    # undone by one scale-up period.
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      percent:
        value: 25
        periodSeconds: 60

image:
  # ECR repositories created by `EcrStack-Staging` / `EcrStack-Production`. The
  # account and region are the consumer's, so the default is deliberately a
  # placeholder that fails to pull rather than a public image that succeeds:
  # a chart that comes up running something is harder to notice than one that
  # does not come up at all.
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/staging-app
  # Immutable tags only. The schema rejects `latest`, `main`, `master`, `stable`
  # and `edge` outright: a moving tag makes the running image a function of when
  # a pod happened to restart, so two pods in one ReplicaSet can serve different
  # code and a rollback has nothing to roll back to.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Only needed for registries outside the cluster's IRSA/ECR path. ECR pulls are
# authorised by the node role, so this stays empty for the repositories above.
imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the release's fullname when empty.
  name: ""
  # IRSA lives here: `eks.amazonaws.com/role-arn` bound to a role whose trust
  # policy names this namespace and service account. See docs/eks.md §2 and
  # `EksStack.addIrsaRole`. Left empty by default because a role ARN is
  # account-specific — each environment file supplies its own.
  annotations: {}
  # A pod that makes no Kubernetes API calls does not need a projected API
  # token; `automountServiceAccountToken: false` removes one credential from the
  # container filesystem without removing IRSA, which is delivered through a
  # separate projected volume the AWS SDK reads.
  automountServiceAccountToken: false

# Pod-level security context: the identity every container in the pod runs as.
#
# The split between this block and `securityContext` below is not cosmetic — the
# Kubernetes API puts different fields in each, and a field written in the wrong
# one is either rejected or, worse, accepted and ignored. Identity (`runAsUser`,
# `runAsGroup`, `fsGroup`) and `seccompProfile` are pod-level; `capabilities`,
# `readOnlyRootFilesystem` and `allowPrivilegeEscalation` are container-level and
# do not exist here.
#
# Together the two blocks satisfy the `restricted` Pod Security Standard, which
# is what a namespace labelled `pod-security.kubernetes.io/enforce: restricted`
# admits. The chart does not label the namespace — that is the cluster
# operator's call — but a chart that cannot pass the standard makes the label
# unavailable to them.
#
# Every value here is fixed by `values.schema.json` rather than merely defaulted:
# `runAsNonRoot` must be `true`, and the UIDs must not be 0. An environment file
# that wants a root container is not overriding a default, it is opting out of
# the posture the rest of this chart is built on, and it fails to render.
podSecurityContext:
  runAsNonRoot: true
  # 10001 rather than the more common 1000: a low UID collides with the first
  # real account in most base images, and inheriting that account's home
  # directory and supplementary groups is not something the image intended to
  # grant. It has to exist in the image, or the container starts with a UID that
  # has no passwd entry — which works, but breaks anything that calls
  # `getpwuid()`, including most language runtimes' `os.homedir()`.
  runAsUser: 10001
  runAsGroup: 10001
  # Applied to the emptyDir volumes below, so a process running as 10001 can
  # write to them. Without it the volume is owned by root and a read-only root
  # filesystem leaves the container with nowhere to write at all.
  fsGroup: 10001
  # `RuntimeDefault` is containerd's seccomp profile — the one that blocks the
  # ~50 syscalls no ordinary workload issues. Unconfined is the Kubernetes
  # default when this field is absent, so leaving the block out is not "no
  # opinion", it is the weakest of the three. `Localhost` is the third option
  # and requires a profile the node already carries; the schema demands
  # `localhostProfile` alongside it, because `type: Localhost` on its own is a
  # manifest the API server rejects.
  seccompProfile:
    type: RuntimeDefault

# Container-level security context: what the process may do once it is running.
#
# `readOnlyRootFilesystem` is the one with a cost, and it is paid in
# `writableVolumes` below rather than by turning it off. The others are free for
# an ordinary HTTP service: it binds a high port, writes to a scratch directory,
# and needs no kernel capability to do either.
securityContext:
  # Blocks `setuid` binaries and file capabilities from raising privileges
  # mid-process — the mechanism behind most container escapes that start from
  # code execution as an unprivileged user. Setting `privileged: false` without
  # this leaves that path open.
  allowPrivilegeEscalation: false
  privileged: false
  # The container filesystem is immutable, so a compromise cannot drop a binary
  # into it and nothing that gets written survives a restart — which also means
  # a process that writes to disk expecting persistence fails immediately and
  # visibly rather than losing data quietly at the next rollout.
  readOnlyRootFilesystem: true
  capabilities:
    # `ALL` rather than an enumerated list. The default set containerd grants is
    # 14 capabilities including `CAP_NET_RAW` (raw sockets, so ARP spoofing
    # inside the pod network) and `CAP_CHOWN`; enumerating what to drop means
    # revisiting the list every time a runtime adds to its default, and nothing
    # tells you when that happens.
    drop:
      - ALL
    # Anything here is granted back after the drop. `npm run audit:helm` allows
    # `NET_BIND_SERVICE` and nothing else, and only when `containerPort` is
    # actually privileged — see `ALLOWED_ADDED_CAPABILITIES` in
    # `tools/audit-helm-values.ts`.
    add: []

# Scratch space, because the root filesystem is read-only.
#
# Almost every runtime writes somewhere: Node to `/tmp` for its inspector socket
# and `os.tmpdir()`, the JVM to `/tmp` for `hsperfdata`, Go's `os.CreateTemp`,
# and any TLS library that spools a large request body. A read-only root
# filesystem with no writable path is the configuration that looks correct in
# review and CrashLoopBackOffs on the first request that needs a temporary file.
#
# `sizeLimit` is required by the schema. An unbounded `emptyDir` shares the
# node's ephemeral storage with every other pod on it, so a service that leaks
# temporary files evicts its neighbours before it evicts itself, and the
# eviction message names the node rather than the culprit.
#
# The volumes are disk-backed, not `medium: Memory`. A tmpfs `emptyDir` counts
# against the container's memory limit, and `requests.memory == limits.memory`
# here — so a full `/tmp` would arrive as an OOMKill with no stack and would
# quietly shrink the heap available to the process long before that.
#
# This is a list, and Helm replaces lists wholesale rather than merging them —
# so an environment file that adds a second scratch path has to restate `tmp`
# alongside it or lose it. That failure is a container with no `/tmp` in one
# environment only, which is the shape of bug that reaches production because
# staging never exercised it.
writableVolumes:
  - name: tmp
    mountPath: /tmp
    sizeLimit: 64Mi

# The port the container listens on. Named `http` in the pod spec, and referred
# to by name from the Service and the probes, so changing it here changes it
# everywhere.
containerPort: 8080

service:
  type: ClusterIP
  port: 80
  annotations: {}

# Network policy: deny everything, then allow what is named here.
#
# Two objects are rendered — `<release>-default-deny`, which selects this
# release's pods and denies both directions, and `<release>-allow`, which is
# the allowlist. `templates/networkpolicy.yaml` says why they are separate.
#
# Three things about this block are not obvious, and each is a way an allowlist
# ends up meaning something other than what it reads as:
#
#   • **One entry is one peer, so its selectors are ANDed.** In the Kubernetes
#     API, two selectors in one `from` element mean "pods matching B in
#     namespaces matching A"; the same two as separate elements mean "either".
#     The two are one character apart in YAML. Here an entry always becomes one
#     element, so allowing two sources means writing two entries.
#   • **An omitted `namespaceLabels` does not mean "any namespace".** A peer
#     with only a `podSelector` matches those pods *in this release's own
#     namespace*. That is usually what is wanted and never what it looks like.
#   • **Ports are matched against the destination pod's port, not the
#     Service's.** kube-proxy rewrites the destination to `containerPort`
#     before policy is evaluated, so an ingress entry naming `service.port`
#     matches nothing and the traffic is denied. `npm run audit:helm` fails on
#     that specifically, because the symptom — connections that hang and then
#     time out — points at the application.
#
# Enforcement is not automatic. Kubernetes has no built-in NetworkPolicy
# controller: the API server stores these objects whatever the cluster does
# with them, so on a CNI that does not implement policy they are accepted,
# visible in `kubectl get netpol`, and enforce nothing. On EKS that means the
# VPC CNI's network policy agent, which `EksStack` turns on through the add-on's
# `enableNetworkPolicy` configuration — see docs/network-policies.md §1.
networkPolicy:
  # Off is for a cluster whose CNI cannot enforce policy. It is not a way to
  # unblock a service: a release that needs a peer it is not allowed needs the
  # peer added below, and `npm run audit:helm` fails on a values file that
  # turns this off precisely so that the quick fix is not the silent one.
  enabled: true

  # Egress to cluster DNS. Separate from the `egress` list because it is not a
  # policy decision — a default-deny egress policy without it drops every name
  # lookup these pods make, and the failure surfaces as five-second timeouts
  # rather than as anything that names the network.
  #
  # Both labels are ones the cluster maintains rather than ones this chart
  # asserts: `kubernetes.io/metadata.name` is set on every namespace by the API
  # server, and `k8s-app: kube-dns` is what the EKS CoreDNS add-on labels its
  # pods (the name is a holdover from kube-dns; the pods are CoreDNS).
  dns:
    enabled: true
    namespaceLabels:
      kubernetes.io/metadata.name: kube-system
    podLabels:
      k8s-app: kube-dns

  # Who may open a connection to these pods.
  #
  # Empty, and that is the current state of this cluster rather than a
  # placeholder: there is no ingress controller yet — it is the last Phase 8
  # item — so nothing exists that should be reaching them. The Service still
  # resolves and still has endpoints; a connection to it is dropped.
  #
  # When the Ingress lands, the entry that opens it is:
  #
  #   ingress:
  #     - name: ingress-controller
  #       namespaceLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  #       podLabels:
  #         app.kubernetes.io/name: ingress-nginx
  #       ports:
  #         - port: http          # the container port by name, not service.port
  #           protocol: TCP
  #
  # Kubelet health probes are not covered by this list. They originate on the
  # node rather than from a pod, and the VPC CNI's policy agent does not apply
  # policy to node-to-pod traffic — which is what keeps a default-deny ingress
  # policy from failing every readiness probe on the cluster. It is also
  # CNI-specific behaviour, so a cluster running something else is the case to
  # check before assuming it holds.
  ingress: []

  # Where these pods may open a connection to.
  #
  # One entry, and it is the one every workload here actually needs: HTTPS to
  # AWS. IRSA exchanges the projected service account token at STS, and any SDK
  # call — Secrets Manager, S3, DynamoDB — is HTTPS to a public endpoint
  # reached through the NAT gateway. Narrowing this to VPC endpoint addresses is
  # a real improvement and needs those endpoints to exist first; docs/network-
  # policies.md §4 has the shape.
  #
  # The `except` is the instance metadata service. Note what it is and is not:
  # the node launch template already requires IMDSv2 at a hop limit of 1, which
  # is the control that actually puts IMDS out of a container's reach, and this
  # is the second one. It matters because the first is a property of the node
  # that someone can lower for an afternoon of debugging, and this one is a
  # property of the release that they cannot lower without editing a file in
  # git.
  egress:
    - name: aws-apis
      cidr: 0.0.0.0/0
      except:
        - 169.254.169.254/32
      ports:
        - port: 443
          protocol: TCP

# Requests and limits are required by the schema, not optional. A container with
# no requests is scheduled as BestEffort and is the first thing evicted under
# node pressure; a container with no memory limit can take the node's other pods
# down with it. Both failures happen under load, in production, and nowhere else.
#
# CPU has requests but no limit on purpose: CFS throttling adds tail latency to
# a service that is not otherwise short of CPU, and the request is what actually
# reserves capacity. Memory is not compressible, so it carries both, and
# `requests.memory == limits.memory` puts the pod in the Guaranteed QoS class.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

probes:
  # Liveness restarts a container that is wedged. Point it at something that
  # says "this process is alive" and nothing more — a liveness probe that checks
  # a database turns one dependency outage into a cluster-wide restart loop.
  liveness:
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  # Readiness gates traffic. This one may check dependencies: a pod that cannot
  # serve should leave the Service's endpoints and come back when it can.
  readiness:
    path: /readyz
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  # Startup gives a slow boot room to finish without a lenient
  # `initialDelaySeconds` on liveness — which is the usual alternative, and it
  # delays every restart for the lifetime of the deployment, not just the first.
  # failureThreshold × periodSeconds is the budget: 30 × 2s = 60s here.
  startup:
    path: /healthz
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30

# Rendered into a ConfigMap and injected with `envFrom`, so adding a key here
# adds an environment variable. The pod template carries a checksum of the
# ConfigMap, so changing a value rolls the Deployment instead of leaving the
# running pods on the old configuration until something else restarts them.
#
# Configuration only. Anything secret comes from Secrets Manager through
# External Secrets or an IRSA-authorised SDK call — never from here, because a
# ConfigMap is readable by anything with `get configmaps` in the namespace.
config:
  LOG_LEVEL: info
  LOG_FORMAT: json

# Extra environment variables that are not simple configuration — a value from
# the downward API, or one that must be ordered after `envFrom`.
extraEnv: []

podAnnotations: {}
podLabels: {}

# A PDB is what makes a voluntary disruption — a node drain during a cluster
# upgrade, a Cluster Autoscaler scale-down — wait for a replacement pod instead
# of taking the last healthy replica. `minAvailable` is expressed as a count
# rather than a percentage so its meaning does not change when replicaCount does.
#
# It has to stay below the *floor* of the fleet, which is `autoscaling.minReplicas`
# when the HPA is on and `replicaCount` when it is not. A budget that only holds
# at the fleet's busy-hour size is a budget that blocks every drain at 4am.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Surge one pod above the desired count and never drop below it, so a rollout
# never reduces capacity. Costs one pod's worth of resources for the duration of
# the rollout, which is the trade every rollout makes.
strategy:
  maxSurge: 1
  maxUnavailable: 0

# Long enough for in-flight requests to finish after the pod leaves the Service
# endpoints. Shorter than the longest request means truncated responses during
# every deploy.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
