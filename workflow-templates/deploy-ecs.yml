# Deploy an image to an ECS service.
#
# The image is verified before it is deployed: it must carry a Sigstore
# signature made by a workflow whose certificate identity matches
# `signer-identity-regexp`, issued by `signer-oidc-issuer`. An image that is
# unsigned, or signed by anybody else, does not reach the cluster.
#
# What the task definition gets is the *digest* the verification resolved, not
# the tag it was given. Verifying `app:v1` and then deploying `app:v1` are two
# separate registry reads, and a tag can be repointed between them; the second
# read is the one that runs in production.
#
# The deploy role needs `ecr:GetAuthorizationToken` and, when the caller passes
# a tag rather than a digest, `ecr:DescribeImages` on the repository.
#
# See docs/image-signing.md.

name: Deploy to ECS

on:
  workflow_call:
    inputs:
      image-uri:
        description: >-
          Image to deploy. Prefer a digest (`repo@sha256:…`, the `image-ref`
          output of docker-build-push.yml); a tag is resolved to a digest here
          and the digest is what gets deployed.
        required: true
        type: string
      cluster:
        required: true
        type: string
      service:
        required: true
        type: string
      container-name:
        required: true
        type: string
      task-definition:
        required: true
        type: string
      aws-region:
        type: string
        default: us-east-1
      signer-identity-regexp:
        description: >-
          Regular expression the signing certificate's identity must match, e.g.
          `^https://github\.com/OWNER/REPO/\.github/workflows/build\.yml@refs/heads/main$`.
          Required, and a pattern that matches every identity is refused: a
          signature by *someone* is not a signature by your build.
        required: true
        type: string
      signer-oidc-issuer:
        description: Issuer that must have issued the signing certificate.
        type: string
        default: https://token.actions.githubusercontent.com
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

env:
  # The version cosign-installer v4.1.2 defaults to, pinned explicitly: the
  # verifier decides what "verified" means, so bumping the action must not
  # change it silently.
  COSIGN_VERSION: v3.0.6

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # cosign reads the registry with the credentials in ~/.docker/config.json,
      # which this writes. The signature is an artifact in the same private ECR
      # repository as the image, and is unreadable without them.
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify the image signature
        id: verify
        env:
          IMAGE_URI: ${{ inputs.image-uri }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
          OIDC_ISSUER: ${{ inputs.signer-oidc-issuer }}
        run: |
          set -euo pipefail

          # cosign requires an identity and an issuer, so the way this gate is
          # usually defeated is not by omitting them — it is by passing `.*`,
          # which verifies that somebody, anybody, signed the image. Anyone with
          # a GitHub account can arrange that for an image of their own.
          case "$IDENTITY_REGEXP" in
            ''|'.*'|'.+'|'^.*'|'^.+'|'.*$'|'^.*$'|'^.+$')
              echo "::error::signer-identity-regexp is '${IDENTITY_REGEXP}', which matches every signer." >&2
              echo "::error::Pin it to the workflow that builds this image, e.g." >&2
              echo "::error::  ^https://github\\.com/OWNER/REPO/\\.github/workflows/build\\.yml@refs/heads/main\$" >&2
              exit 1
              ;;
          esac

          case "$IMAGE_URI" in
            *@sha256:*)
              IMAGE_REF="$IMAGE_URI"
              ;;
            *)
              # Resolve the tag once, here, and deploy what it pointed at.
              REGISTRY="${IMAGE_URI%%/*}"
              REPOSITORY_AND_TAG="${IMAGE_URI#*/}"
              case "$REPOSITORY_AND_TAG" in
                *:*)
                  REPOSITORY="${REPOSITORY_AND_TAG%:*}"
                  TAG="${REPOSITORY_AND_TAG##*:}"
                  ;;
                *)
                  REPOSITORY="$REPOSITORY_AND_TAG"
                  TAG="latest"
                  ;;
              esac

              # Assumes ECR: the account id is the first label of the registry
              # host. For any other registry, resolve the digest with
              # `crane digest` instead.
              DIGEST="$(aws ecr describe-images \
                --registry-id "${REGISTRY%%.*}" \
                --repository-name "$REPOSITORY" \
                --image-ids "imageTag=$TAG" \
                --query 'imageDetails[0].imageDigest' \
                --output text)"

              if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                echo "::error::Could not resolve $IMAGE_URI to a digest (got '${DIGEST}')." >&2
                exit 1
              fi

              IMAGE_REF="$REGISTRY/$REPOSITORY@$DIGEST"
              ;;
          esac

          if ! cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > /dev/null; then
            echo "::error::No signature on $IMAGE_REF matches identity /${IDENTITY_REGEXP}/" >&2
            echo "::error::from issuer ${OIDC_ISSUER}. The image was either never signed or" >&2
            echo "::error::was signed by something other than the build this service trusts." >&2
            exit 1
          fi

          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Verified $IMAGE_REF against /${IDENTITY_REGEXP}/"

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ inputs.task-definition }} \
            --query taskDefinition > task-definition.json

      # The verified digest, not `inputs.image-uri`. This is the whole point of
      # the resolution above.
      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container-name }}
          image: ${{ steps.verify.outputs.image-ref }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.service }}
          cluster: ${{ inputs.cluster }}
          wait-for-service-stability: true
