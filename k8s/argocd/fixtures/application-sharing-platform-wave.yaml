# The workload shares a wave with the add-on its HPA reads; within a wave the
# order is by kind and then by name. Rule: sync-wave-ordering.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: app
  source:
    repoURL: https://github.com/Kojo-Brown/boilerplate-devops.git
    targetRevision: main
    path: k8s/charts/app
    helm:
      releaseName: app-staging
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
