# A `v`-prefixed chart *range*. cert-manager publishes exact chart versions with
# that prefix — `v1.21.1` — so the prefix alone is not what makes a revision
# mutable and the audit accepts it. A comparator in front of it is: Argo CD
# re-resolves this on every reconciliation, and a new upstream release reaches
# the cluster through self-heal with no commit and no diff.
# Rule: mutable-target-revision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: ">=v1.21.1"
    helm:
      releaseName: cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
