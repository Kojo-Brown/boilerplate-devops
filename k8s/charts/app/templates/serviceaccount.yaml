{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
  IRSA is delivered through a projected token volume the kubelet mounts because
  of the `eks.amazonaws.com/role-arn` annotation, not through the service
  account's API token — so turning the API token off leaves AWS access intact
  while removing a Kubernetes credential from the container filesystem.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
{{- end }}
