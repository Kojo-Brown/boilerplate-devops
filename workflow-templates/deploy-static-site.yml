# Deploy a static site (React, Next.js static export, Vue, etc.) to S3 + CloudFront.
#
# Prerequisites:
#   1. Deploy StaticSiteStack via CDK (aws/cdk/lib/static-site-stack.ts).
#   2. Add the following GitHub Secrets / Variables to your repository:
#
#      Secrets:
#        AWS_ROLE_ARN          — ARN of the IAM role to assume (OIDC; from GitHubOidcStack)
#      Variables:
#        AWS_REGION            — e.g. us-east-1
#        S3_BUCKET_NAME        — value of StaticSiteStack output "SiteBucketName"
#        CLOUDFRONT_DIST_ID    — value of StaticSiteStack output "DistributionId"
#
# Usage (call from your app repo):
#
#   jobs:
#     deploy-staging:
#       uses: Kojo-Brown/boilerplate-devops/.github/workflows/deploy-static-site.yml@main
#       with:
#         environment: staging
#         build-command: pnpm build
#         build-output-dir: dist
#         s3-bucket: ${{ vars.STAGING_S3_BUCKET_NAME }}
#         cloudfront-dist-id: ${{ vars.STAGING_CLOUDFRONT_DIST_ID }}
#         aws-region: us-east-1
#       secrets:
#         aws-role-arn: ${{ secrets.STAGING_AWS_ROLE_ARN }}

name: Deploy Static Site

# The release artifact here is the built bundle synced to S3, and its SBOM is
# taken from the *source tree after the build* rather than from the bundle
# itself. That is deliberate: a bundler erases package identity, so a scan of
# `dist/` finds a handful of minified files and no components at all, while the
# lockfile beside it names every dependency that went in. Scanning after the
# build rather than before means a build that rewrites the lockfile is
# inventoried as it shipped.
#
# The SBOM is kept as a workflow artifact and is deliberately *not* synced to
# the site bucket: that bucket is served to the public through CloudFront, and
# publishing a complete dependency-and-version list there hands an attacker the
# CVE shortlist for free. See docs/sbom.md.

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (staging | production)"
        type: string
        required: true
      build-command:
        description: "Command to build the static site (e.g. 'pnpm build')"
        type: string
        required: false
        default: "pnpm build"
      build-output-dir:
        description: "Directory containing build output to sync to S3 (e.g. 'dist' or 'out')"
        type: string
        required: false
        default: "dist"
      node-version:
        description: "Node.js version to use for building"
        type: string
        required: false
        default: "22"
      s3-bucket:
        description: "Target S3 bucket name (StaticSiteStack SiteBucketName output)"
        type: string
        required: true
      cloudfront-dist-id:
        description: "CloudFront distribution ID to invalidate after deploy"
        type: string
        required: true
      aws-region:
        description: "AWS region where the S3 bucket lives (must be us-east-1 for CloudFront)"
        type: string
        required: false
        default: "us-east-1"
      invalidation-paths:
        description: "Space-separated CloudFront paths to invalidate (default: '/*')"
        type: string
        required: false
        default: "/*"
      cache-control-immutable:
        description: "Glob patterns (comma-separated) for assets with immutable cache headers"
        type: string
        required: false
        default: "*.js,*.css,*.woff2,*.woff,*.ttf,*.svg,*.png,*.jpg,*.webp,*.avif"
      cache-control-html:
        description: "Cache-Control value for HTML files (revalidated on every request)"
        type: string
        required: false
        default: "no-cache, no-store, must-revalidate"
      working-directory:
        description: "Repository subdirectory that contains the project (monorepo support)"
        type: string
        required: false
        default: "."
      sbom-retention-days:
        description: "Days to keep the CycloneDX SBOM as a workflow artifact (1–90)"
        type: number
        required: false
        default: 90
      trivy-image:
        description: >-
          Trivy image, in digest form (`repository:tag@sha256:…`). Pinned by
          content because the scanner is what decides whether "no findings" is
          true; anything without a digest is rejected at run time.
        type: string
        required: false
        default: "public.ecr.aws/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
      vulnerability-severity:
        description: >-
          Severities that fail the deploy, as a Trivy severity list. Raising the
          threshold is a caller's choice; lowering it below HIGH,CRITICAL is
          refused at run time. See docs/vulnerability-scanning.md §2.
        type: string
        required: false
        default: "HIGH,CRITICAL"
      trivyignore-file:
        description: >-
          Path, relative to the repository root, of a `.trivyignore.yaml` of
          accepted-risk exceptions. Every entry needs a `statement` and an
          `expired_at`. Empty means no exceptions.
        type: string
        required: false
        default: ""
      vulnerability-db-max-age-hours:
        description: >-
          How old Trivy's vulnerability database may be before this scan is
          treated as untrustworthy. A stale database reports fewer findings and
          looks exactly like a clean scan.
        type: number
        required: false
        default: 48
    secrets:
      aws-role-arn:
        description: "ARN of the IAM role to assume via OIDC"
        required: true
    outputs:
      site-url:
        description: "Public URL of the deployed site"
        value: ${{ jobs.deploy.outputs.site-url }}
      distribution-domain:
        description: "CloudFront domain name (*.cloudfront.net)"
        value: ${{ jobs.deploy.outputs.distribution-domain }}

env:
  # v1.51.1 is also sbom-action v0.24.2's own default — pinning it here keeps
  # that true after the action is bumped.
  SYFT_VERSION: v1.51.1
  SBOM_FILE: sbom.cdx.json
  # Every severity, fixable or not. The gate narrows to what policy blocks on;
  # this is the record of everything that shipped.
  VULN_REPORT: trivy-report.json

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write  # required for OIDC token
      contents: read

    outputs:
      site-url: ${{ steps.site-info.outputs.site-url }}
      distribution-domain: ${{ steps.site-info.outputs.distribution-domain }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── Node.js + package manager ─────────────────────────────────────────────
      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      # ── Install dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build static site
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}
        env:
          NODE_ENV: production

      # ── Validate build output ─────────────────────────────────────────────────
      - name: Validate build output
        working-directory: ${{ inputs.working-directory }}
        run: |
          BUILD_DIR="${{ inputs.build-output-dir }}"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error::Build output directory '$BUILD_DIR' does not exist."
            echo "::error::Check the 'build-output-dir' input matches your build tool output (dist, out, build, public)."
            exit 1
          fi
          FILE_COUNT=$(find "$BUILD_DIR" -type f | wc -l)
          echo "Build output: $FILE_COUNT files in $BUILD_DIR"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Build output directory is empty."
            exit 1
          fi
          find "$BUILD_DIR" -maxdepth 1 -printf '%10s  %p\n' | head -20

      # ── Software bill of materials ────────────────────────────────────────────
      # Generated before the first `aws s3 sync` so that a bundle nobody can
      # inventory never reaches the bucket. Syft is pinned for the same reason
      # the lockfile is: two runs of one commit must not disagree about what
      # shipped because the scanner moved underneath them.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ inputs.working-directory }}
          format: cyclonedx-json
          output-file: ${{ env.SBOM_FILE }}
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: true
          artifact-name: sbom-${{ inputs.environment }}.cdx.json
          upload-artifact-retention: ${{ inputs.sbom-retention-days }}
          # Nothing here cuts a GitHub Release, and the default would make every
          # deploy try to and log a failure nobody acts on.
          upload-release-assets: false

      # Syft exits 0 and writes a schema-valid CycloneDX document when it finds
      # nothing — a wrong `working-directory`, a lockfile format it does not
      # understand, an install that never ran. `"components": []` passes every
      # other check in this file, so assert the document is what it claims to be
      # and that it actually found something.
      - name: Verify SBOM
        env:
          SCANNED_PATH: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail

          jq empty "$SBOM_FILE"

          FORMAT=$(jq -r '.bomFormat // ""' "$SBOM_FILE")
          if [ "$FORMAT" != "CycloneDX" ]; then
            echo "::error::$SBOM_FILE has bomFormat '$FORMAT', expected 'CycloneDX'."
            exit 1
          fi

          SPEC=$(jq -r '.specVersion // ""' "$SBOM_FILE")
          if [ -z "$SPEC" ]; then
            echo "::error::$SBOM_FILE declares no specVersion."
            exit 1
          fi

          COMPONENTS=$(jq '.components | length' "$SBOM_FILE")
          if [ "$COMPONENTS" -eq 0 ]; then
            echo "::error::$SBOM_FILE lists no components. Syft found no packages under"
            echo "::error::'$SCANNED_PATH' — check that the lockfile is committed and that"
            echo "::error::'working-directory' points at the project root."
            exit 1
          fi

          # Exported so the deployment summary below can tie this deploy to the
          # exact inventory that gated it.
          SBOM_SHA=$(sha256sum "$SBOM_FILE" | cut -d ' ' -f 1)
          echo "SBOM_SHA256=$SBOM_SHA" >> "$GITHUB_ENV"
          echo "CycloneDX $SPEC, $COMPONENTS components, sha256:$SBOM_SHA"

      # ── Known vulnerabilities ─────────────────────────────────────────────────
      # The SBOM says what went into the bundle; this asks whether any of it is
      # known to be exploitable. Both run before the first `aws s3 sync`, so a
      # bundle that fails either never reaches the bucket — which is the only
      # place the ordering matters, since after the sync it is already served.
      #
      # Scanned from the source tree for the same reason the SBOM is: a bundler
      # erases package identity, so `dist/` is a handful of minified files with
      # no versions in them, while the lockfile beside it names every dependency
      # that went in.
      - name: Inventory the bundle's vulnerabilities
        id: vuln-report
        working-directory: ${{ inputs.working-directory }}
        env:
          TRIVY_IMAGE: ${{ inputs.trivy-image }}
          DB_MAX_AGE_HOURS: ${{ inputs.vulnerability-db-max-age-hours }}
        run: |
          set -euo pipefail

          case "$TRIVY_IMAGE" in
            *@sha256:*) ;;
            *)
              echo "::error::trivy-image must be pinned by digest (repository:tag@sha256:…)." >&2
              echo "::error::Got '$TRIVY_IMAGE'." >&2
              exit 1
              ;;
          esac

          mkdir -p "${RUNNER_TEMP}/trivy-cache"

          docker run --rm \
            -v "${RUNNER_TEMP}:/work" \
            -v "${PWD}:/src:ro" \
            "$TRIVY_IMAGE" \
            fs \
              --scanners vuln \
              --cache-dir /work/trivy-cache \
              --format json \
              --output "/work/${VULN_REPORT}" \
              --exit-code 0 \
              /src

          REPORT="${RUNNER_TEMP}/${VULN_REPORT}"
          jq empty "$REPORT"

          DB_UPDATED="$(docker run --rm \
            -v "${RUNNER_TEMP}:/work" \
            "$TRIVY_IMAGE" \
            version --cache-dir /work/trivy-cache --format json \
            | jq -r '.VulnerabilityDB.UpdatedAt // ""')"

          if [ -z "$DB_UPDATED" ]; then
            echo "::error::Trivy reports no vulnerability database. The scan above consulted" >&2
            echo "::error::nothing, and its empty result means nothing." >&2
            exit 1
          fi

          DB_AGE_HOURS=$(( ( $(date -u +%s) - $(date -u -d "$DB_UPDATED" +%s) ) / 3600 ))
          if [ "$DB_AGE_HOURS" -gt "$DB_MAX_AGE_HOURS" ]; then
            echo "::error::Trivy's vulnerability database was last updated $DB_UPDATED," >&2
            echo "::error::${DB_AGE_HOURS}h ago, older than the ${DB_MAX_AGE_HOURS}h this workflow" >&2
            echo "::error::accepts. Anything published since is invisible to this scan." >&2
            exit 1
          fi

          # Trivy writes a schema-valid report with no `Results` key at all when
          # it recognises no package source — a wrong `working-directory`, an
          # uncommitted lockfile, a manifest format it does not read. That
          # report passes every other check here and looks exactly like a clean
          # one, which is the same failure the SBOM step above guards against.
          RESULT_COUNT="$(jq '(.Results // []) | length' "$REPORT")"
          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "::error::Trivy found no package source under '$PWD'. Nothing was scanned," >&2
            echo "::error::so the clean result below is about nothing — check that the lockfile" >&2
            echo "::error::is committed and that 'working-directory' points at the project root." >&2
            exit 1
          fi

          COUNTS="$(jq -c '
            [(.Results // [])[] | (.Vulnerabilities // [])[]]
            | group_by(.Severity)
            | map({ key: .[0].Severity, value: length })
            | from_entries
          ' "$REPORT")"

          {
            echo "counts=$COUNTS"
            echo "db-updated=$DB_UPDATED"
          } >> "$GITHUB_OUTPUT"

          echo "Trivy DB from $DB_UPDATED (${DB_AGE_HOURS}h old); $RESULT_COUNT target(s); $COUNTS"

      # The gate. `--exit-code 1` is the whole of it: the flag defaults to 0, so
      # a scan that says nothing about it prints its findings and succeeds.
      - name: Fail on fixable HIGH and CRITICAL vulnerabilities
        working-directory: ${{ inputs.working-directory }}
        env:
          TRIVY_IMAGE: ${{ inputs.trivy-image }}
          SEVERITY: ${{ inputs.vulnerability-severity }}
          TRIVYIGNORE_FILE: ${{ inputs.trivyignore-file }}
        run: |
          set -euo pipefail

          for REQUIRED in HIGH CRITICAL; do
            case ",${SEVERITY}," in
              *",${REQUIRED},"*) ;;
              *)
                echo "::error::vulnerability-severity is '${SEVERITY}', which omits ${REQUIRED}." >&2
                echo "::error::A gate that lets a fixable ${REQUIRED} through is reporting, not" >&2
                echo "::error::gating. See docs/vulnerability-scanning.md §2." >&2
                exit 1
                ;;
            esac
          done

          IGNORE=()
          if [ -n "$TRIVYIGNORE_FILE" ]; then
            if [ ! -f "${GITHUB_WORKSPACE}/${TRIVYIGNORE_FILE}" ]; then
              # A missing ignore file is not an error to Trivy — it means "no
              # exceptions". So a typo'd path is a gate that is stricter than
              # anyone intended until the day somebody corrects the path.
              echo "::error::trivyignore-file '${TRIVYIGNORE_FILE}' does not exist." >&2
              exit 1
            fi
            IGNORE=(--ignorefile "/ignore/${TRIVYIGNORE_FILE}")
          fi

          # `--ignore-unfixed`: block on what this deploy can act on. An
          # unfixable HIGH is in the report above and is worth an alert; holding
          # every unrelated deploy until upstream ships is what turns this exit
          # code into a 0. `--skip-db-update`: the step above downloaded the
          # database and asserted its age.
          docker run --rm \
            -v "${RUNNER_TEMP}:/work" \
            -v "${PWD}:/src:ro" \
            -v "${GITHUB_WORKSPACE}:/ignore:ro" \
            "$TRIVY_IMAGE" \
            fs \
              --scanners vuln \
              --cache-dir /work/trivy-cache \
              --severity "$SEVERITY" \
              --ignore-unfixed \
              --skip-db-update \
              "${IGNORE[@]}" \
              --format table \
              --exit-code 1 \
              /src

          echo "No fixable ${SEVERITY} findings in the bundle's dependencies."

      # Deliberately a workflow artifact and never synced to the site bucket,
      # for the same reason the SBOM is not: that bucket is public, and a list
      # of every version you are running is worth more to an attacker than to
      # anyone else.
      - name: Upload the vulnerability report
        if: always() && steps.vuln-report.outputs.counts != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-report-${{ inputs.environment }}.json
          path: ${{ runner.temp }}/${{ env.VULN_REPORT }}
          retention-days: ${{ inputs.sbom-retention-days }}

      # ── AWS credentials via OIDC ──────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: static-site-deploy-${{ inputs.environment }}-${{ github.run_id }}

      # ── Sync HTML files (no-cache) ────────────────────────────────────────────
      # Upload HTML first with no-cache so CDN edge nodes revalidate index.html
      # and entry points immediately. Hashed assets are uploaded after.
      - name: Sync HTML files (no-cache)
        working-directory: ${{ inputs.working-directory }}
        run: |
          aws s3 sync \
            "${{ inputs.build-output-dir }}" \
            "s3://${{ inputs.s3-bucket }}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "${{ inputs.cache-control-html }}" \
            --content-type "text/html; charset=utf-8" \
            --delete \
            --no-progress

      # ── Sync immutable hashed assets (long-lived cache) ───────────────────────
      - name: "Sync immutable assets (cache: 1 year)"
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Build the --include flags as an array rather than a string: an array
          # survives patterns containing spaces or globs without eval, which
          # would otherwise re-parse the bucket name and paths as shell code.
          IFS=',' read -ra PATTERNS <<< "${{ inputs.cache-control-immutable }}"
          INCLUDE_ARGS=()
          for pattern in "${PATTERNS[@]}"; do
            pattern=$(echo "$pattern" | xargs)  # trim whitespace
            INCLUDE_ARGS+=(--include "$pattern")
          done
          aws s3 sync \
            "${{ inputs.build-output-dir }}" \
            "s3://${{ inputs.s3-bucket }}" \
            --exclude "*" \
            "${INCLUDE_ARGS[@]}" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # ── Sync remaining static assets ──────────────────────────────────────────
      - name: "Sync remaining files (cache: 1 hour)"
        working-directory: ${{ inputs.working-directory }}
        run: |
          aws s3 sync \
            "${{ inputs.build-output-dir }}" \
            "s3://${{ inputs.s3-bucket }}" \
            --exclude "*.html" \
            --cache-control "public, max-age=3600" \
            --no-progress

      # ── CloudFront cache invalidation ─────────────────────────────────────────
      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          PATHS="${{ inputs.invalidation-paths }}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.cloudfront-dist-id }}" \
            --paths $PATHS \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation-id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          echo "Created invalidation: $INVALIDATION_ID"

      # ── Wait for invalidation to complete ─────────────────────────────────────
      - name: Wait for CloudFront invalidation
        run: |
          echo "Waiting for invalidation ${{ steps.invalidate.outputs.invalidation-id }} to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ inputs.cloudfront-dist-id }}" \
            --id "${{ steps.invalidate.outputs.invalidation-id }}"
          echo "Invalidation complete."

      # ── Retrieve site info ────────────────────────────────────────────────────
      - name: Get site URL
        id: site-info
        run: |
          DOMAIN=$(aws cloudfront get-distribution \
            --id "${{ inputs.cloudfront-dist-id }}" \
            --query 'Distribution.DomainName' \
            --output text)
          echo "distribution-domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "site-url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Site URL: https://$DOMAIN"

      # ── Smoke test ────────────────────────────────────────────────────────────
      - name: Smoke test — check HTTP 200
        run: |
          DOMAIN="${{ steps.site-info.outputs.distribution-domain }}"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "https://$DOMAIN/")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Smoke test returned HTTP $STATUS (expected 200) for https://$DOMAIN/"
          else
            echo "Smoke test passed: HTTP $STATUS"
          fi

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          {
            echo "## Static Site Deployed ✓"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| S3 Bucket | \`${{ inputs.s3-bucket }}\` |"
            echo "| CloudFront Distribution | \`${{ inputs.cloudfront-dist-id }}\` |"
            echo "| Invalidation | \`${{ steps.invalidate.outputs.invalidation-id }}\` |"
            echo "| Site URL | ${{ steps.site-info.outputs.site-url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| SBOM | \`sbom-${{ inputs.environment }}.cdx.json\` (CycloneDX, $(jq '.components | length' "$SBOM_FILE") components) |"
            echo "| SBOM sha256 | \`$SBOM_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"
