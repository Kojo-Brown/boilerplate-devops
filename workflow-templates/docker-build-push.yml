# Build a container image, inventory it, and push both to ECR.
#
# The SBOM is generated from the built image *before* the push, so an image
# whose contents cannot be inventoried never becomes a release. It is then
# attached to the pushed image as an OCI referrer, which is what makes it travel
# with the artifact: a workflow artifact expires after 90 days, an image in ECR
# does not, and the thing an incident responder has in front of them when the
# next Log4Shell lands is the image.
#
# Scanning the *image* rather than the source tree is the whole point. A scan of
# `.` reports what the repository declares — it cannot see the base image's OS
# packages, anything a `RUN apt-get install` added, or a dependency the build
# vendored in. Those are the layers CVEs are usually found in.
#
# The image is then signed, keylessly, with the run's own GitHub OIDC identity,
# and the signature is verified before the workflow reports success. Signing is
# the only step here that has to happen *after* the push — there is no manifest
# to sign until the registry holds one — which is the mirror image of the SBOM's
# ordering and the reason the two gates read the workflow in opposite directions.
#
# The signature is made over the digest, never the tag. `cosign sign app:v1`
# resolves the tag and signs whatever it pointed at, which is a different
# statement from "this run signed the image this run built".
#
# Between the inventory and the push, the image is scanned for known
# vulnerabilities and the build fails on fixable HIGH and CRITICAL findings. The
# SBOM records what is in the image; this asks whether any of it is known to be
# exploitable, which is a question none of the other three gates here answers —
# a pinned, signed, inventoried, fully attested image with a critical CVE in its
# base layer satisfies all of them.
#
# `--exit-code 1` is the whole of it. Both the `trivy` CLI and
# `aquasecurity/trivy-action` default to exit code 0, so a scan with nothing
# said about it prints a table of CVEs into a log nobody reads and succeeds.
# That is the default, not a mistake somebody has to make.
#
# The gate blocks on *fixable* findings only. A CRITICAL with no patched version
# available is real and worth an alert, and there is nothing this build can do
# about it: blocking would stop every unrelated deploy until upstream ships, and
# what gets changed under that pressure is the exit code — which switches the
# gate off for the fixable ones too. The step above it records every severity,
# fixable or not, so nothing is hidden by the threshold. See
# docs/vulnerability-scanning.md.
#
# Last, the image gets SLSA build provenance: a signed statement of *how* it was
# produced — which repository, which commit, which workflow, on which runner —
# bound to the same digest. That is a third question, and none of the other two
# answers it. The SBOM says what is inside the image; the signature says this
# workflow published it; provenance says what went in and what built it, which
# is what has to be evidence rather than memory the first time someone asks
# whether the thing in production came from `main`.
#
# See docs/sbom.md, docs/vulnerability-scanning.md, docs/image-signing.md and
# docs/provenance.md.

name: Docker Build & Push to ECR

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      aws-region:
        type: string
        default: us-east-1
      dockerfile:
        type: string
        default: Dockerfile
      sbom-retention-days:
        description: "Days to keep the SBOM as a workflow artifact. The copy attached to the image in ECR does not expire."
        type: number
        default: 90
      trivy-image:
        description: >-
          Trivy image, in digest form (`repository:tag@sha256:…`). The scanner
          decides what "no findings" means, so it is pinned by content for the
          same reason `secret-scanning.yml` pins TruffleHog: a tag is a pointer
          its publisher can move, and `latest` — which
          `aquasecurity/trivy-action`'s `version` input defaults to — makes two
          runs of the same commit able to disagree. Anything without a digest
          is rejected at run time rather than pulled.
        type: string
        default: "public.ecr.aws/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
      vulnerability-severity:
        description: >-
          Severities that fail the build, as a Trivy severity list. The default
          is this repository's documented policy; lowering it below
          HIGH,CRITICAL is refused at run time, because a gate that lets a
          fixable CRITICAL through is reporting rather than gating.
        type: string
        default: "HIGH,CRITICAL"
      trivyignore-file:
        description: >-
          Path, relative to the repository root, of a `.trivyignore.yaml`
          holding accepted-risk exceptions. Every entry needs a `statement` and
          an `expired_at`; see docs/vulnerability-scanning.md §4. Empty means no
          exceptions.
        type: string
        default: ""
      vulnerability-db-max-age-hours:
        description: >-
          How old Trivy's vulnerability database may be before the scan is
          treated as untrustworthy. A scan against a stale database reports
          nothing and looks identical to a clean one.
        type: number
        default: 48
      signer-identity-regexp:
        description: >-
          Regular expression the signing certificate's identity must match when
          this workflow verifies its own signature and its own provenance.
          Defaults to any workflow in the repository the run belongs to, which
          is correct when this template has been copied into that repository.
          Set it explicitly when the workflow is called from another repository:
          the identity is then the *reusable* workflow's path in the repository
          that hosts it, not the caller's.
        type: string
        default: ""

    secrets:
      AWS_ROLE_ARN:
        required: true

    # Job-level `outputs:` are not visible to a caller of a reusable workflow —
    # they have to be re-declared here. Without this block `image-uri` was
    # unreachable from the calling workflow, and the SBOM digest would be too.
    outputs:
      image-uri:
        description: "Fully qualified URI of the image that was pushed"
        value: ${{ jobs.build-push.outputs.image-uri }}
      sbom-referrer-digest:
        description: "Digest of the SBOM manifest attached to the image, for verifying the inventory a deploy was gated on"
        value: ${{ jobs.build-push.outputs.sbom-referrer-digest }}
      image-digest:
        description: "Digest of the pushed manifest, e.g. sha256:… . This is what was signed."
        value: ${{ jobs.build-push.outputs.image-digest }}
      image-ref:
        description: >-
          The image pinned by digest. Hand *this* to a deploy rather than
          `image-uri`: a tag is a pointer, and a deploy that verifies one
          reference and runs another has verified nothing.
        value: ${{ jobs.build-push.outputs.image-ref }}
      provenance-url:
        description: "GitHub summary page for the SLSA build provenance attested over the pushed digest"
        value: ${{ jobs.build-push.outputs.provenance-url }}
      vulnerability-counts:
        description: "Findings by severity in the image that was published, as JSON — every severity, not just the ones that block"
        value: ${{ jobs.build-push.outputs.vulnerability-counts }}

permissions:
  id-token: write
  contents: read
  # `actions/attest` uploads the signed provenance to the attestations API.
  # Without this the step fails at run time, after the image has already been
  # published — and a caller of this reusable workflow has to grant it too: the
  # token a called workflow gets is the intersection of the two blocks, so a
  # caller job that narrows `permissions:` silently takes it away again.
  attestations: write

env:
  # Pinned so the inventory is reproducible: two runs of the same commit should
  # not disagree about what is in the image because the scanner moved underneath
  # them. v1.51.1 is also sbom-action v0.24.2's own default — pinning it here
  # keeps that true after the action is bumped.
  SYFT_VERSION: v1.51.1
  ORAS_VERSION: 1.3.4
  SBOM_FILE: sbom.cdx.json
  # The full report, every severity, fixable or not. Written before the gate
  # runs so that what the build blocked on is inspectable afterwards rather than
  # being whatever scrolled past in a log.
  VULN_REPORT: trivy-report.json
  # The version cosign-installer v4.1.2 defaults to. Pinned explicitly so that
  # bumping the action — a routine dependency update — cannot quietly change the
  # binary that decides what a signature over this repository's images means.
  COSIGN_VERSION: v3.0.6
  # Where GitHub's OIDC tokens come from. A signature is only evidence of who
  # made it if the issuer is pinned too: an identity string proves nothing when
  # any issuer may assert it.
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  # The predicate type SLSA build provenance carries. Pinned as a value rather
  # than left to the verifier's default, because it is the difference between
  # "this image has an attestation" and "this image has a *provenance*
  # attestation" — and `actions/attest` can produce three different kinds.
  SLSA_PREDICATE_TYPE: https://slsa.dev/provenance/v1

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.build.outputs.image-uri }}
      sbom-referrer-digest: ${{ steps.attach-sbom.outputs.referrer-digest }}
      image-digest: ${{ steps.push.outputs.image-digest }}
      image-ref: ${{ steps.push.outputs.image-ref }}
      provenance-url: ${{ steps.provenance.outputs.attestation-url }}
      vulnerability-counts: ${{ steps.vuln-report.outputs.counts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Build only. The push is a separate step below so that everything between
      # the two — the inventory and its verification — gates the release.
      - name: Build image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE: ${{ inputs.image-name }}
          SHA: ${{ github.sha }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          IMAGE_URI="$REGISTRY/$IMAGE:$SHA"
          docker build -f "$DOCKERFILE" -t "$IMAGE_URI" -t "$REGISTRY/$IMAGE:latest" .
          {
            echo "image-uri=$IMAGE_URI"
            # The repository with no tag on it. The provenance attestation names
            # the subject this way — a tag in `subject-name` makes the push to
            # the registry target a reference that is not the image.
            echo "image-repository=$REGISTRY/$IMAGE"
          } >> "$GITHUB_OUTPUT"

      # oras reads ~/.docker/config.json, which amazon-ecr-login has already
      # populated for this registry, so `oras attach` needs no separate login.
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      # Syft resolves a bare image reference against the local Docker daemon
      # first, so this inventories the image just built rather than pulling
      # whatever the registry happens to hold under that tag.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.image-uri }}
          format: cyclonedx-json
          output-file: ${{ env.SBOM_FILE }}
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: true
          artifact-name: ${{ env.SBOM_FILE }}
          upload-artifact-retention: ${{ inputs.sbom-retention-days }}

      # Syft exits 0 and writes a schema-valid CycloneDX document when it finds
      # nothing at all — a mistyped reference, a scratch image, a source it does
      # not understand all produce `"components": []`. Every gate downstream of
      # here would pass on that file, and the SBOM would be worthless in exactly
      # the situation it exists for. Assert the document is what it claims to be
      # and that it actually found something before the image ships.
      - name: Verify SBOM
        env:
          IMAGE_URI: ${{ steps.build.outputs.image-uri }}
        run: |
          set -euo pipefail

          jq empty "$SBOM_FILE"

          FORMAT=$(jq -r '.bomFormat // ""' "$SBOM_FILE")
          if [ "$FORMAT" != "CycloneDX" ]; then
            echo "::error::$SBOM_FILE has bomFormat '$FORMAT', expected 'CycloneDX'."
            exit 1
          fi

          SPEC=$(jq -r '.specVersion // ""' "$SBOM_FILE")
          if [ -z "$SPEC" ]; then
            echo "::error::$SBOM_FILE declares no specVersion."
            exit 1
          fi

          COMPONENTS=$(jq '.components | length' "$SBOM_FILE")
          if [ "$COMPONENTS" -eq 0 ]; then
            echo "::error::$SBOM_FILE lists no components. Syft found nothing in $IMAGE_URI."
            echo "::error::A scratch or distroless image with a statically linked binary is the"
            echo "::error::one legitimate cause; anything else means the scan missed the image."
            exit 1
          fi

          # The SBOM names its subject in metadata.component. If that is not the
          # image just built, the file describes something else and attaching it
          # to this image would be a lie told with a valid document.
          SUBJECT=$(jq -r '.metadata.component.name // ""' "$SBOM_FILE")
          if [ -z "$SUBJECT" ]; then
            # Checked separately: an empty subject would match the glob below
            # and pass, which is the one way this assertion could be vacuous.
            echo "::error::$SBOM_FILE names no subject in metadata.component.name."
            exit 1
          fi
          case "$IMAGE_URI" in
            *"$SUBJECT"*) ;;
            *)
              echo "::error::$SBOM_FILE describes '$SUBJECT', which is not part of $IMAGE_URI."
              exit 1
              ;;
          esac

          echo "CycloneDX $SPEC, $COMPONENTS components, subject '$SUBJECT'."

      # Trivy exits 0 and writes a schema-valid report with no `Results` key at
      # all when it cannot identify anything to scan — an unreadable archive, an
      # image whose package manager it does not recognise. Every gate downstream
      # of that passes, and the release looks like one that came back clean. It
      # is the same shape as the SBOM's `"components": []` a few steps above,
      # and it is checked here for the same reason.
      #
      # The database is checked too. A scan against a stale one reports fewer
      # findings and is indistinguishable in a log from a scan that found
      # nothing, so "the scanner ran" is not the property worth asserting.
      - name: Inventory the image's vulnerabilities
        id: vuln-report
        env:
          IMAGE_URI: ${{ steps.build.outputs.image-uri }}
          TRIVY_IMAGE: ${{ inputs.trivy-image }}
          DB_MAX_AGE_HOURS: ${{ inputs.vulnerability-db-max-age-hours }}
        run: |
          set -euo pipefail

          # A scanner named by tag is chosen by the registry at the moment the
          # step starts. This is the one tool in the pipeline whose output is a
          # statement about what it did *not* find.
          case "$TRIVY_IMAGE" in
            *@sha256:*) ;;
            *)
              echo "::error::trivy-image must be pinned by digest (repository:tag@sha256:…)." >&2
              echo "::error::Got '$TRIVY_IMAGE'." >&2
              exit 1
              ;;
          esac

          mkdir -p "${RUNNER_TEMP}/trivy-cache"

          # `--input` on a saved archive rather than a reference the scanner
          # resolves itself, so Trivy never needs the Docker socket. Mounting it
          # would give a third-party image full control of the daemon in a job
          # that is also holding this build's AWS credentials.
          docker save "$IMAGE_URI" -o "${RUNNER_TEMP}/image.tar"

          # Report-only, every severity: this is the record, not the gate. The
          # gate is the next step, and it deliberately narrows to the severities
          # policy says block — but nothing should be invisible just because it
          # does not block.
          docker run --rm \
            -v "${RUNNER_TEMP}:/work" \
            "$TRIVY_IMAGE" \
            image \
              --input /work/image.tar \
              --cache-dir /work/trivy-cache \
              --scanners vuln \
              --format json \
              --output "/work/${VULN_REPORT}" \
              --exit-code 0

          REPORT="${RUNNER_TEMP}/${VULN_REPORT}"
          jq empty "$REPORT"

          DB_UPDATED="$(docker run --rm \
            -v "${RUNNER_TEMP}:/work" \
            "$TRIVY_IMAGE" \
            version --cache-dir /work/trivy-cache --format json \
            | jq -r '.VulnerabilityDB.UpdatedAt // ""')"

          if [ -z "$DB_UPDATED" ]; then
            echo "::error::Trivy reports no vulnerability database. The scan above consulted" >&2
            echo "::error::nothing and its empty result means nothing." >&2
            exit 1
          fi

          DB_AGE_HOURS=$(( ( $(date -u +%s) - $(date -u -d "$DB_UPDATED" +%s) ) / 3600 ))
          if [ "$DB_AGE_HOURS" -gt "$DB_MAX_AGE_HOURS" ]; then
            echo "::error::Trivy's vulnerability database was last updated $DB_UPDATED," >&2
            echo "::error::${DB_AGE_HOURS}h ago, which is older than the ${DB_MAX_AGE_HOURS}h this" >&2
            echo "::error::workflow accepts. Anything published since is invisible to this scan." >&2
            exit 1
          fi

          RESULT_COUNT="$(jq '(.Results // []) | length' "$REPORT")"
          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "::error::Trivy identified nothing to scan in $IMAGE_URI: the report contains no" >&2
            echo "::error::results at all, which is what it writes when it cannot read the image" >&2
            echo "::error::or recognise any package source in it. A scratch or distroless image" >&2
            echo "::error::holding one statically linked binary is the single legitimate cause;" >&2
            echo "::error::anything else means this build was not scanned." >&2
            exit 1
          fi

          COUNTS="$(jq -c '
            [(.Results // [])[] | (.Vulnerabilities // [])[]]
            | group_by(.Severity)
            | map({ key: .[0].Severity, value: length })
            | from_entries
          ' "$REPORT")"

          {
            echo "counts=$COUNTS"
            echo "db-updated=$DB_UPDATED"
          } >> "$GITHUB_OUTPUT"

          echo "Trivy DB from $DB_UPDATED (${DB_AGE_HOURS}h old); $RESULT_COUNT target(s); $COUNTS"

      # The gate. `--exit-code 1` is the entire difference between this and a
      # scan that decorates a log: both the CLI flag and the trivy-action input
      # default to 0.
      - name: Fail on fixable HIGH and CRITICAL vulnerabilities
        env:
          TRIVY_IMAGE: ${{ inputs.trivy-image }}
          SEVERITY: ${{ inputs.vulnerability-severity }}
          TRIVYIGNORE_FILE: ${{ inputs.trivyignore-file }}
        run: |
          set -euo pipefail

          # A caller can raise the threshold but not lower it past the policy.
          # `audit-vulnerability-scanning.ts` checks the literal in this file;
          # an input's value only exists at run time, and "HIGH,CRITICAL"
          # narrowed to "CRITICAL" by a caller is exactly the change that no
          # review in this repository would ever see.
          for REQUIRED in HIGH CRITICAL; do
            case ",${SEVERITY}," in
              *",${REQUIRED},"*) ;;
              *)
                echo "::error::vulnerability-severity is '${SEVERITY}', which omits ${REQUIRED}." >&2
                echo "::error::A gate that lets a fixable ${REQUIRED} through is reporting, not" >&2
                echo "::error::gating. See docs/vulnerability-scanning.md §2." >&2
                exit 1
                ;;
            esac
          done

          IGNORE=()
          if [ -n "$TRIVYIGNORE_FILE" ]; then
            if [ ! -f "${GITHUB_WORKSPACE}/${TRIVYIGNORE_FILE}" ]; then
              # Trivy treats a missing ignore file as no exceptions and carries
              # on, so a typo'd path is a gate that is stricter than intended
              # today and silently unenforced the day someone "fixes" it.
              echo "::error::trivyignore-file '${TRIVYIGNORE_FILE}' does not exist." >&2
              exit 1
            fi
            IGNORE=(--ignorefile "/src/${TRIVYIGNORE_FILE}")
          fi

          # `--ignore-unfixed`: fail on what this build can act on. An
          # unfixable CRITICAL is in the report above and belongs in an alert;
          # blocking on it holds every unrelated deploy until upstream ships,
          # and the change that gets made under that pressure is to this exit
          # code. See docs/vulnerability-scanning.md §2.
          #
          # `--skip-db-update`: the step above downloaded the database and
          # asserted its age. Re-downloading 100+ MB to reach the same verdict
          # is the thing that makes people cache badly.
          docker run --rm \
            -v "${RUNNER_TEMP}:/work" \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            "$TRIVY_IMAGE" \
            image \
              --input /work/image.tar \
              --cache-dir /work/trivy-cache \
              --scanners vuln \
              --severity "$SEVERITY" \
              --ignore-unfixed \
              --skip-db-update \
              "${IGNORE[@]}" \
              --format table \
              --exit-code 1

          echo "No fixable ${SEVERITY} findings in the image."

      - name: Upload the vulnerability report
        if: always() && steps.vuln-report.outputs.counts != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.VULN_REPORT }}
          path: ${{ runner.temp }}/${{ env.VULN_REPORT }}
          retention-days: ${{ inputs.sbom-retention-days }}

      # The digest is captured here rather than derived later because everything
      # after this point — the signature, and every deploy that checks it —
      # names the image by digest. `docker image inspect` would answer from the
      # local daemon, which is the image that was *built*; the push output is
      # the registry telling us what it stored.
      - name: Push image
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE: ${{ inputs.image-name }}
          IMAGE_URI: ${{ steps.build.outputs.image-uri }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_URI" | tee push.log
          docker push "$REGISTRY/$IMAGE:latest"

          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n 1)"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not read the pushed digest out of docker push's output." >&2
            echo "::error::Nothing below this point can name the image safely; refusing to sign." >&2
            exit 1
          fi

          # The daemon and the registry must agree: a mismatch means the tag was
          # repointed between the build and the push, and the image about to be
          # signed is not the one that was inventoried a few steps ago.
          LOCAL_DIGEST="$(docker image inspect "$IMAGE_URI" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | sed -n 's/.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' | sort -u)"
          if [ "$(printf '%s\n' "$LOCAL_DIGEST" | grep -c .)" -ne 1 ] || [ "$LOCAL_DIGEST" != "$DIGEST" ]; then
            echo "::error::The registry stored $DIGEST but the local image resolves to:" >&2
            printf '%s\n' "$LOCAL_DIGEST" >&2
            exit 1
          fi

          {
            echo "image-digest=$DIGEST"
            echo "image-ref=$REGISTRY/$IMAGE@$DIGEST"
          } >> "$GITHUB_OUTPUT"

      # `oras attach` writes the SBOM as a separate manifest whose `subject` is
      # the image manifest, so `oras discover` finds it from the image alone and
      # a `docker pull` is unaffected. ORAS negotiates the OCI 1.1 Referrers API
      # and falls back to the referrers-tag schema on registries that predate it;
      # ECR supports the API directly.
      - name: Attach SBOM to the image
        id: attach-sbom
        env:
          IMAGE_URI: ${{ steps.build.outputs.image-uri }}
        run: |
          set -euo pipefail
          oras attach \
            --artifact-type application/vnd.cyclonedx+json \
            --export-manifest referrer-manifest.json \
            "$IMAGE_URI" \
            "$SBOM_FILE:application/vnd.cyclonedx+json"

          # An OCI digest is the hash over the manifest's exact bytes, which is
          # what --export-manifest writes. Deriving it here rather than parsing
          # `oras attach --format go-template` keeps this off ORAS's experimental
          # output flags, which carry no compatibility promise.
          REFERRER_DIGEST="sha256:$(sha256sum referrer-manifest.json | cut -d ' ' -f 1)"
          echo "referrer-digest=$REFERRER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Attached $SBOM_FILE to $IMAGE_URI as $REFERRER_DIGEST"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Both self-verifications below — the signature and the provenance — ask
      # the same question of the same certificate, so the identity is resolved
      # once here rather than derived twice in two shell blocks that can drift
      # apart. A build that verified its signature against one identity and its
      # provenance against another would be asserting two different things and
      # reporting one.
      - name: Resolve the signer identity
        id: signer
        env:
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
        run: |
          set -euo pipefail

          if [ -z "$IDENTITY_REGEXP" ]; then
            # `.` is legal in a repository name, so escape before interpolating
            # into a regular expression. `$` sits last in the character class
            # only so that the linter does not read `$(` as a command
            # substitution inside the single quotes.
            ESCAPED_REPO="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[.[\*^()+?{|$]/\\&/g')"
            IDENTITY_REGEXP="^https://github\.com/${ESCAPED_REPO}/\.github/workflows/"
          fi

          echo "identity-regexp=$IDENTITY_REGEXP" >> "$GITHUB_OUTPUT"
          echo "Signer identity must match /${IDENTITY_REGEXP}/"

      # Keyless. There is no private key to store, rotate, or leak: cosign
      # exchanges this job's OIDC token for a short-lived Fulcio certificate
      # that records *which workflow, in which repository, at which ref* asked
      # for it, and logs the signature in Rekor. That recorded identity is the
      # thing a deploy checks — a signing key, by contrast, only proves that
      # whoever holds the key signed, which is a much weaker claim and one that
      # survives the key being stolen.
      #
      # Requires `id-token: write`, which this workflow already declares for
      # AWS OIDC.
      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.push.outputs.image-ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"

      # Sign, then immediately verify with the same constraints a deploy will
      # apply. Without this, a signature nothing can verify — the wrong issuer,
      # an identity that does not match what the deploy expects, a Rekor entry
      # that never landed — is indistinguishable from a good one until the
      # deploy fails, in a different repository, hours later.
      - name: Verify the signature this run just made
        env:
          IMAGE_REF: ${{ steps.push.outputs.image-ref }}
          IDENTITY_REGEXP: ${{ steps.signer.outputs.identity-regexp }}
        run: |
          set -euo pipefail

          if ! cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > cosign-verification.json; then
            echo "::error::The signature this run just made does not verify against" >&2
            echo "::error::  identity  $IDENTITY_REGEXP" >&2
            echo "::error::  issuer    $OIDC_ISSUER" >&2
            echo "::error::If this workflow is called from another repository, the signing" >&2
            echo "::error::identity is this workflow's own path in the repository that hosts" >&2
            echo "::error::it — pass signer-identity-regexp to match it." >&2
            exit 1
          fi

          echo "Signed by $(jq -r '.[0].optional.Issuer // "unknown issuer"' cosign-verification.json)"

      # SLSA build provenance. GitHub mints an in-toto statement describing this
      # run — source repository and commit, workflow path and ref, runner
      # environment, the build's own parameters — binds it to the pushed digest,
      # and signs it with the same short-lived Sigstore certificate the cosign
      # signature above used.
      #
      # `push-to-registry` is what makes it travel with the artifact. Without it
      # the attestation exists only in GitHub's attestations API, keyed to *this
      # repository*, and everything that has the image but not the repository —
      # a registry replica, another account's ECR, an air-gapped pull — has no
      # way to reach it. With it, the attestation is an OCI referrer on the
      # image, discoverable from the digest alone, which is the only identifier
      # a deploy is guaranteed to have.
      #
      # This is Build L2 provenance, not L3: the build and the attestation run
      # in the same job as everything else this workflow does, so anything that
      # can influence that job can influence what the provenance says about it.
      # L3 requires a builder the caller cannot reach into. See
      # docs/provenance.md §5.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # The repository without a tag, plus the digest the push returned —
          # `subject-path` would attest a file on the runner, which is not the
          # thing anybody pulls.
          subject-name: ${{ steps.build.outputs.image-repository }}
          subject-digest: ${{ steps.push.outputs.image-digest }}
          push-to-registry: true
          # The storage record is a GitHub-side index entry, and creating one
          # needs the `artifact-metadata: write` permission. It is not the
          # attestation: the signed bundle still reaches both the attestations
          # API and the registry without it, and the registry copy is the one a
          # consumer can actually reach.
          create-storage-record: false

      # Attest, then immediately verify — for the same reason the signature is
      # verified above, and against two failures the step above cannot report.
      #
      # `actions/attest` chooses what kind of attestation to make from which
      # inputs it was given: an `sbom-path` makes an SBOM attestation, a
      # `predicate-type` makes a custom one, and only the absence of both makes
      # build provenance. All three sign, upload and attach identically, and
      # every gate downstream of here that only asks "is there an attestation?"
      # is satisfied by all three.
      #
      # And `--bundle-from-oci` reads the attestation back out of the registry
      # rather than from the local file or GitHub's API, so this fails when the
      # push to the registry did not land — the half that everything outside
      # this repository depends on, and the half that is invisible here without
      # asking for it.
      - name: Verify the provenance this run just made
        env:
          IMAGE_REF: ${{ steps.push.outputs.image-ref }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          IDENTITY_REGEXP: ${{ steps.signer.outputs.identity-regexp }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PREDICATE_TYPE="$(jq -r '.dsseEnvelope.payload // ""' "$BUNDLE_PATH" \
            | base64 -d \
            | jq -r '.predicateType // ""')"
          if [ "$PREDICATE_TYPE" != "$SLSA_PREDICATE_TYPE" ]; then
            echo "::error::The attestation this run made carries predicate type" >&2
            echo "::error::  '${PREDICATE_TYPE}'" >&2
            echo "::error::but build provenance is $SLSA_PREDICATE_TYPE. A predicate, sbom-path" >&2
            echo "::error::or predicate-type input on the step above switches actions/attest out" >&2
            echo "::error::of provenance mode without failing." >&2
            exit 1
          fi

          if ! gh attestation verify "oci://$IMAGE_REF" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity-regex "$IDENTITY_REGEXP" \
            --cert-oidc-issuer "$OIDC_ISSUER" \
            --predicate-type "$SLSA_PREDICATE_TYPE" \
            --format json > provenance-verification.json; then
            echo "::error::The provenance this run just attested does not verify against" >&2
            echo "::error::  repository  $GITHUB_REPOSITORY" >&2
            echo "::error::  identity    $IDENTITY_REGEXP" >&2
            echo "::error::  issuer      $OIDC_ISSUER" >&2
            echo "::error::  predicate   $SLSA_PREDICATE_TYPE" >&2
            echo "::error::If this workflow is called from another repository, the signing" >&2
            echo "::error::identity is this workflow's own path in the repository that hosts" >&2
            echo "::error::it — pass signer-identity-regexp to match it." >&2
            exit 1
          fi

          echo "Provenance verified for $IMAGE_REF"

      - name: Summary
        env:
          IMAGE_URI: ${{ steps.build.outputs.image-uri }}
          IMAGE_REF: ${{ steps.push.outputs.image-ref }}
          REFERRER_DIGEST: ${{ steps.attach-sbom.outputs.referrer-digest }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          VULN_COUNTS: ${{ steps.vuln-report.outputs.counts }}
          VULN_DB_UPDATED: ${{ steps.vuln-report.outputs.db-updated }}
          SEVERITY: ${{ inputs.vulnerability-severity }}
        run: |
          {
            echo "## Image published, scanned, inventoried, signed, and attested"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE_URI\` |"
            echo "| Digest | \`$IMAGE_REF\` |"
            echo "| SBOM | CycloneDX JSON, \`$(jq -r '.specVersion' "$SBOM_FILE")\` |"
            echo "| Components | $(jq '.components | length' "$SBOM_FILE") |"
            echo "| Referrer digest | \`$REFERRER_DIGEST\` |"
            echo "| Vulnerabilities | \`$VULN_COUNTS\` (blocking: fixable \`$SEVERITY\`) |"
            echo "| Vulnerability DB | $VULN_DB_UPDATED |"
            echo "| Signature | keyless, \`$OIDC_ISSUER\` |"
            echo "| Provenance | SLSA \`$SLSA_PREDICATE_TYPE\`, [attestation]($PROVENANCE_URL) |"
            echo ""
            echo "Inspect them with:"
            echo ""
            echo '```bash'
            echo "oras discover $IMAGE_REF"
            echo "cosign verify --certificate-identity-regexp ... --certificate-oidc-issuer $OIDC_ISSUER $IMAGE_REF"
            echo "gh attestation verify oci://$IMAGE_REF --bundle-from-oci --repo $GITHUB_REPOSITORY"
            echo '```'
            echo ""
            echo "Deploy \`$IMAGE_REF\`, not the tag: the signature is over the digest."
          } >> "$GITHUB_STEP_SUMMARY"
