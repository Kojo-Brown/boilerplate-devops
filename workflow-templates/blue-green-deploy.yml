name: Blue/Green Deploy to ECS via CodeDeploy

# Reusable workflow: triggers a CodeDeploy blue/green deployment for an ECS service.
#
# How it works:
#   1. Renders a new task definition with the provided image URI.
#   2. Generates an appspec.yaml pointing at the new task def + container.
#   3. Triggers a CodeDeploy deployment which:
#        a. Starts new tasks in the Green target group.
#        b. Routes test traffic to :8443 for smoke-testing.
#        c. Shifts production traffic from Blue → Green per deploymentConfig.
#        d. Terminates old Blue tasks after terminationWaitMinutes.
#        e. Auto-rolls back on ALB 5xx alarm or deployment failure.
#
# Prerequisites (set as GitHub Secrets / Variables):
#   AWS_ROLE_ARN          — IAM role with codedeploy:CreateDeployment + ecs:* permissions
#   The role also needs ecr:GetAuthorizationToken, so cosign can read the
#   signature, and ecr:DescribeImages when the caller passes a tag rather than a
#   digest. See docs/image-signing.md.
#   Outputs from BlueGreenDeployStack:
#     CODEDEPLOY_APP      — CodeDeploy application name  (${envName}-ecs-app)
#     CODEDEPLOY_DG       — Deployment group name        (${envName}-ecs-dg)
#     ECS_CLUSTER         — ECS cluster name             (${envName}-bg-cluster)
#     ECS_SERVICE         — ECS service name             (${envName}-bg-service)
#     TASK_DEFINITION     — Task definition family name  (${envName}-bg-task)

on:
  workflow_call:
    inputs:
      image-uri:
        description: Full ECR image URI including tag (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/app:sha-abc123)
        required: true
        type: string
      cluster:
        description: ECS cluster name (BlueGreenDeployStack output ClusterName)
        required: true
        type: string
      service:
        description: ECS service name (BlueGreenDeployStack output ServiceName)
        required: true
        type: string
      task-definition:
        description: Task definition family name (e.g. production-bg-task)
        required: true
        type: string
      container-name:
        description: Container name inside the task definition (default AppContainer)
        required: false
        type: string
        default: AppContainer
      codedeploy-application:
        description: CodeDeploy application name (BlueGreenDeployStack output CodeDeployApplicationName)
        required: true
        type: string
      codedeploy-deployment-group:
        description: CodeDeploy deployment group name (BlueGreenDeployStack output CodeDeployDeploymentGroupName)
        required: true
        type: string
      aws-region:
        description: AWS region (default us-east-1)
        required: false
        type: string
        default: us-east-1
      wait-for-service-stability:
        description: Block until the deployment completes (default true)
        required: false
        type: boolean
        default: true
      signer-identity-regexp:
        description: >-
          Regular expression the signing certificate's identity must match, e.g.
          `^https://github\.com/OWNER/REPO/\.github/workflows/build\.yml@refs/heads/main$`.
          Required, and a pattern that matches every identity is refused: a
          signature by *someone* is not a signature by your build.
        required: true
        type: string
      signer-oidc-issuer:
        description: Issuer that must have issued the signing certificate.
        required: false
        type: string
        default: https://token.actions.githubusercontent.com
    secrets:
      AWS_ROLE_ARN:
        description: IAM role ARN with CodeDeploy + ECS deploy permissions
        required: true

permissions:
  id-token: write
  contents: read

env:
  # The version cosign-installer v4.1.2 defaults to, pinned explicitly: the
  # verifier decides what "verified" means, so bumping the action must not
  # change it silently.
  COSIGN_VERSION: v3.0.6

jobs:
  blue-green-deploy:
    name: Blue/Green Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # cosign reads the registry with the credentials in ~/.docker/config.json,
      # which this writes. The signature is an artifact in the same private ECR
      # repository as the image, and is unreadable without them.
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Blue/green makes an unverified image worse, not better: CodeDeploy shifts
      # production traffic onto it automatically once the new tasks pass their
      # health checks, and a health check does not care who built the container.
      #
      # The digest resolved here is what the task definition below gets. A tag
      # verified at this step and read again at the next one is two registry
      # reads, and only the second one runs.
      - name: Verify the image signature
        id: verify
        env:
          IMAGE_URI: ${{ inputs.image-uri }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
          OIDC_ISSUER: ${{ inputs.signer-oidc-issuer }}
        run: |
          set -euo pipefail

          # cosign requires an identity and an issuer, so the way this gate is
          # usually defeated is not by omitting them — it is by passing `.*`,
          # which verifies that somebody, anybody, signed the image. Anyone with
          # a GitHub account can arrange that for an image of their own.
          case "$IDENTITY_REGEXP" in
            ''|'.*'|'.+'|'^.*'|'^.+'|'.*$'|'^.*$'|'^.+$')
              echo "::error::signer-identity-regexp is '${IDENTITY_REGEXP}', which matches every signer." >&2
              echo "::error::Pin it to the workflow that builds this image, e.g." >&2
              echo "::error::  ^https://github\\.com/OWNER/REPO/\\.github/workflows/build\\.yml@refs/heads/main\$" >&2
              exit 1
              ;;
          esac

          case "$IMAGE_URI" in
            *@sha256:*)
              IMAGE_REF="$IMAGE_URI"
              ;;
            *)
              # Resolve the tag once, here, and deploy what it pointed at.
              REGISTRY="${IMAGE_URI%%/*}"
              REPOSITORY_AND_TAG="${IMAGE_URI#*/}"
              case "$REPOSITORY_AND_TAG" in
                *:*)
                  REPOSITORY="${REPOSITORY_AND_TAG%:*}"
                  TAG="${REPOSITORY_AND_TAG##*:}"
                  ;;
                *)
                  REPOSITORY="$REPOSITORY_AND_TAG"
                  TAG="latest"
                  ;;
              esac

              # Assumes ECR: the account id is the first label of the registry
              # host. For any other registry, resolve the digest with
              # `crane digest` instead.
              DIGEST="$(aws ecr describe-images \
                --registry-id "${REGISTRY%%.*}" \
                --repository-name "$REPOSITORY" \
                --image-ids "imageTag=$TAG" \
                --query 'imageDetails[0].imageDigest' \
                --output text)"

              if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                echo "::error::Could not resolve $IMAGE_URI to a digest (got '${DIGEST}')." >&2
                exit 1
              fi

              IMAGE_REF="$REGISTRY/$REPOSITORY@$DIGEST"
              ;;
          esac

          if ! cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > /dev/null; then
            echo "::error::No signature on $IMAGE_REF matches identity /${IDENTITY_REGEXP}/" >&2
            echo "::error::from issuer ${OIDC_ISSUER}. The image was either never signed or" >&2
            echo "::error::was signed by something other than the build this service trusts." >&2
            exit 1
          fi

          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Verified $IMAGE_REF against /${IDENTITY_REGEXP}/"

      # Download the current task definition and strip read-only fields so we
      # can register a new revision with the updated image.
      - name: Download current task definition
        id: download-taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ inputs.task-definition }}" \
            --query taskDefinition \
            --output json > task-definition.json
          echo "Task definition downloaded"
          python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # Remove fields that cannot be present when registering a new revision
          for key in ['taskDefinitionArn', 'revision', 'status', 'requiresAttributes',
                      'placementConstraints', 'compatibilities', 'registeredAt',
                      'registeredBy', 'deregisteredAt']:
              d.pop(key, None)
          print(json.dumps(d, indent=2))
          " < task-definition.json > task-definition-clean.json
          mv task-definition-clean.json task-definition.json

      # Render a new task definition revision with the updated container image —
      # the digest the signature was checked against, not the reference the
      # caller passed in.
      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container-name }}
          image: ${{ steps.verify.outputs.image-ref }}

      # Generate appspec.yaml consumed by the CodeDeploy ECS deployment.
      # The <TASK_DEFINITION> placeholder is replaced by the action in the next step.
      - name: Generate appspec.yaml
        run: |
          cat > appspec.yaml << 'EOF'
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: <TASK_DEFINITION>
                  LoadBalancerInfo:
                    ContainerName: "${{ inputs.container-name }}"
                    ContainerPort: 3000
          EOF
          echo "Generated appspec.yaml:"
          cat appspec.yaml

      # Trigger the CodeDeploy blue/green deployment.
      # The action registers the new task definition, fills in <TASK_DEFINITION>
      # in appspec.yaml, and creates the CodeDeploy deployment.
      - name: Deploy via CodeDeploy (Blue/Green)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.service }}
          cluster: ${{ inputs.cluster }}
          wait-for-service-stability: ${{ inputs.wait-for-service-stability }}
          codedeploy-appspec: appspec.yaml
          codedeploy-application: ${{ inputs.codedeploy-application }}
          codedeploy-deployment-group: ${{ inputs.codedeploy-deployment-group }}
