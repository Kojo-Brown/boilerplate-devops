# Deleting this Application would leave every resource it created running,
# owned and reconciled by nothing. Rule: missing-finalizer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: app
  source:
    repoURL: https://github.com/Kojo-Brown/boilerplate-devops.git
    targetRevision: main
    path: k8s/charts/app
    helm:
      releaseName: app-staging
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
