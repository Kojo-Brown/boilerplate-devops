name: CI

# Phase 0 green baseline for this repository: every PR must prove that the CDK
# app compiles, its unit tests pass, it synthesises, the shipped workflow
# templates are valid GitHub Actions, and no new Checkov finding is introduced.
on:
  pull_request:
  # Every job below is a required status check, and a required check that does
  # not report on merge_group leaves its queue entry waiting until
  # check_response_timeout_minutes expires. Enforced by `npm run audit:trunk`.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  cdk:
    name: CDK typecheck, test, synth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aws/cdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: aws/cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Everything here is copy-paste material, so a literal account ID or
      # credential in a template becomes one in the consumer's repository.
      # Scans the whole repository, not just aws/cdk.
      - name: Scan for hardcoded account IDs, ARNs, and credentials
        run: npm run scan:identifiers

      # The ruleset and the workflows that satisfy it are edited independently
      # and nothing in GitHub reconciles them. A required check with no producer
      # blocks every pull request; with a merge queue enabled it stalls the
      # queue. Both are silent until the first merge attempt, so they are
      # checked here instead.
      - name: Audit trunk-based guardrails
        run: npm run audit:trunk

      # An unsafe migration is invisible in review — it is ordinary SQL, and it
      # fails only under load, only in production, and only during the deploy
      # window when the old code is the only code running. Checking the shipped
      # example on every PR also keeps it executed rather than illustrative.
      - name: Audit migration expand/contract safety
        run: npm run audit:migrations

      # A flag with no owner, no ticket, or no removal date is the state every
      # abandoned flag is already in, and it is invisible in review because the
      # declaration that is missing is the one nobody looks for. Deliberately
      # runs without `--now`: expiry is enforced at deploy time and by the daily
      # sweep, not by turning every build in the repository red on a date the
      # pull request in front of you did not choose. See docs/feature-flags.md.
      - name: Audit feature flag manifests
        run: npm run audit:flags

      # Helm enforces `values.schema.json` on the values file it is handed. It
      # has no opinion about an environment that has no values file, a schema
      # whose objects have drifted open and so catch nothing, or a
      # `minAvailable` that exceeds its own `replicaCount`. This runs here,
      # rather than in the Helm job, because it needs no Helm binary — it
      # validates with ajv, which is already a dependency.
      - name: Audit Helm chart values
        run: npm run audit:helm

      # The GitOps tree is the only thing in this repository that a cluster
      # applies without anyone running a command, and it is the least checked:
      # the API server validates an Application against a CRD whose `spec.source`
      # is an object, so a project that does not exist, a production Application
      # rendering staging's values, or a `selfHeal` nobody turned on are all
      # valid manifests. Every one of them surfaces on the cluster, after merge,
      # or not at all. See docs/gitops-argocd.md.
      - name: Audit Argo CD manifests
        run: npm run audit:argocd

      # An artifact published without an SBOM is not a broken build — it is a
      # perfectly green one that cannot answer "is this affected?" when the next
      # advisory lands, and nobody asks that question until the day it matters.
      # The near misses are quieter still: anchore/sbom-action defaults to SPDX,
      # so an omitted `format` produces a good SBOM in the wrong format, and a
      # scan pointed at the source tree rather than the image cannot see the
      # base-image packages where most CVEs are found. See docs/sbom.md.
      - name: Audit SBOM coverage of release artifacts
        run: npm run audit:sbom

      # An image nobody signed and an image nobody verifies are both perfectly
      # green pipelines. So is the middle case that actually happens: a deploy
      # that runs `cosign verify --certificate-identity-regexp '.*'`, which
      # asserts that somebody signed the image — a property anyone with a GitHub
      # account can arrange for an image of their own. This also holds the two
      # halves in step, since a signature made over a tag, or a deploy that
      # verifies a digest and then ships a tag, verifies something other than
      # what runs. See docs/image-signing.md.
      - name: Audit image signing and deploy-time verification
        run: npm run audit:signing

      # Synth runs before the suite deliberately. It is the build step and takes
      # seconds, while the suite takes minutes; ordering it first means a test
      # failure never hides whether the app still synthesises.
      - name: Synthesize all stacks
        run: npx cdk synth --quiet

      # The Checkov job scans the synthesised CloudFormation rather than the
      # TypeScript, so the templates have to cross the job boundary.
      #
      # Templates only, not the whole of cdk.out: the EKS stacks stage a kubectl
      # and an AWS CLI Lambda layer as assets, which take the directory from a
      # few MB to over 60. Checkov reads the templates and nothing else, and the
      # glob keeps the nested stack templates, which it also scans.
      - name: Upload synthesised templates
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: aws/cdk/cdk.out/*.template.json
          retention-days: 7

      - name: Unit tests
        run: npm test -- --ci

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      # Both the workflows this repo runs and the templates it ships to
      # consumers must lint — a broken template is the product being broken.
      #
      # actionlint shells out to shellcheck for every `run:` block when
      # shellcheck is on PATH, which it is on ubuntu-latest. Install shellcheck
      # before running this locally or local runs will silently skip those
      # checks and disagree with CI.
      - name: Lint workflows and shipped templates
        run: actionlint -no-color -oneline .github/workflows/*.yml workflow-templates/*.yml

      # Scripts a workflow shells out to are not reachable from actionlint —
      # it only sees the `run:` block that invokes them, which is one quoted
      # path. Without this they are the only shell in the repository nothing
      # checks.
      - name: Lint helper scripts
        run: shellcheck .github/scripts/*.sh

  # The name is the required-status-check context in
  # `.github/rulesets/trunk-based-main.json`; renaming the job renames the
  # check, and `npm run audit:trunk` fails when the two drift apart.
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The cluster version EksStack creates — see docs/eks.md §4. Rendering
      # against an explicit version rather than whatever the Helm build defaults
      # to means the manifests CI checks are the manifests the cluster gets.
      KUBE_VERSION: "1.33.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The chart's schema is enforced at deploy time by Helm's own validator,
      # which is a different implementation of JSON Schema from the ajv one the
      # CDK job uses. Both run, because a schema checked only against ajv has
      # not been checked against the thing that decides whether an upgrade
      # succeeds.
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint and render every chart, and reject the schema fixtures
        run: .github/scripts/lint-helm-chart.sh

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: pip install --disable-pip-version-check "checkov==3.3.8"

      - name: Download synthesised templates
        uses: actions/download-artifact@v4
        with:
          name: cdk-out
          path: cdk.out

      # .checkov.baseline records the findings that already existed when this
      # gate was introduced. Anything not in the baseline fails the build, so
      # new infrastructure cannot regress while the backlog is burned down.
      - name: Scan synthesised CloudFormation
        run: |
          checkov \
            --directory cdk.out \
            --framework cloudformation \
            --baseline .checkov.baseline \
            --quiet \
            --compact

      - name: Scan GitHub Actions workflows
        run: |
          checkov \
            --directory .github/workflows \
            --framework github_actions \
            --quiet \
            --compact
