# The ingress controller for the production cluster.
#
# This is what gives the Ingress in `k8s/charts/app` an address. Without a
# controller that claims the `nginx` IngressClass, the Ingress object is
# admitted, listed, and served by nothing — and because external-dns publishes
# the record from the Ingress's `status.loadBalancer` address, an unclaimed
# Ingress also means no DNS record. Both symptoms read as DNS problems.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    # Wave 3: after the ClusterIssuer (2), before external-dns (4), which reads
    # the address this controller's Service acquires.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          # Two replicas behind a budget, where staging runs one. Every request
          # that reaches this cluster passes through these pods, so a rollout or
          # a node drain that leaves none ready is a full outage rather than a
          # degraded one — and with `externalTrafficPolicy: Local` below, it is
          # also an NLB whose target set is empty.
          replicaCount: 2

          # One controller may be taken down at a time. `minAvailable: 1` would
          # permit a drain that leaves a single pod, and with `Local` traffic
          # policy that is one node's worth of the NLB's targets.
          minAvailable: 1

          # Spread the two across availability zones rather than letting the
          # scheduler pack them onto one node. `DoNotSchedule` rather than
          # `ScheduleAnyway`: a second replica on the same node as the first is
          # the arrangement that makes the PDB above meaningless, so refusing to
          # schedule it is the louder failure.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: ingress-nginx
                  app.kubernetes.io/component: controller

          ingressClassResource:
            name: nginx
            enabled: true
            # Not the cluster default, deliberately. `default: true` makes this
            # controller adopt every Ingress that names no class — including
            # ones created by a chart nobody audited, and including the ones
            # somebody meant to point at a second controller later. The app
            # chart names `ingressClassName: nginx` explicitly.
            default: false

          # Left false, which is the chart's default and worth keeping on
          # purpose: a `configuration-snippet` annotation is arbitrary nginx
          # configuration, so anyone who can create an Ingress in any namespace
          # can otherwise rewrite the proxy in front of every other namespace.
          allowSnippetAnnotations: false

          service:
            type: LoadBalancer
            annotations:
              # A Network Load Balancer through the AWS cloud controller
              # manager, which EKS runs on the control plane. The AWS Load
              # Balancer Controller is the more capable path — target-type ip,
              # WAF association, a `scheme` annotation — and it is not installed
              # here: it needs its own add-on and its own IAM policy, and this
              # annotation needs neither. docs/ingress.md §3 states what that
              # choice costs.
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              # Off by default on an NLB, and off means each of the load
              # balancer's zonal nodes forwards only to targets in its own
              # availability zone. Combined with `externalTrafficPolicy: Local`
              # below — where a node is only a healthy target while it runs a
              # controller pod — a zone with no controller pod is a zone whose
              # NLB address stops answering, and it stops being handed out only
              # as fast as the 60-second DNS record expires in each client.
              service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
            # Preserves the client's source IP: with `Cluster` the packet is
            # SNATed by the second node's kube-proxy and every request arrives
            # from a node address, which breaks rate limiting, allowlists and
            # access logs at once.
            #
            # The trade is that only nodes running a controller pod pass the
            # NLB's health check, so the replica count, the budget and the zone
            # spread above are what keep the target set from collapsing to one
            # node — and, with cross-zone routing, to one zone.
            externalTrafficPolicy: Local

          config:
            # Nothing sits in front of nginx that sets `X-Forwarded-For`: the
            # NLB forwards TCP without touching the request. Trusting the header
            # would therefore mean trusting whatever the client sent, which is
            # the header every source-IP allowlist is built on.
            use-forwarded-headers: "false"
            # nginx sets HSTS on TLS responses by default; the max-age is
            # written out because the default (365 days) is a security decision
            # that should be visible in a diff.
            hsts: "true"
            hsts-max-age: "31536000"
            server-tokens: "false"
            # Plaintext requests are redirected rather than served. This is safe
            # here precisely because the ACME challenge is DNS-01: an HTTP-01
            # setup needs `/.well-known/acme-challenge/` reachable over
            # plaintext, and this redirect is what silently breaks its renewals
            # months after issuance worked.
            ssl-redirect: "true"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

          # The admission webhook validates an Ingress's generated nginx
          # configuration before the object is accepted, so a bad annotation
          # fails `kubectl apply` instead of reloading a broken config across
          # every controller pod. Its serving certificate comes from the
          # chart's own patch Jobs rather than from cert-manager — which is
          # deliberate, because cert-manager's webhook would then depend on an
          # ingress controller that depends on cert-manager.
          admissionWebhooks:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      # The namespace is also what the app chart's NetworkPolicy allowlist names
      # — `kubernetes.io/metadata.name: ingress-nginx`, a label the API server
      # sets on every namespace — so renaming it here silently denies the
      # controller access to the pods it fronts.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
